name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter for Android SDK
        run: |
          flutter config --no-analytics
          flutter config --android-sdk "$ANDROID_HOME"
          flutter config --jdk-dir "$JAVA_HOME"
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a256e307309725c147e5ee19c5b" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | flutter doctor --android-licenses || true

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Configure local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ElrashedyERP-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS (IPA)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ElrashedyERP-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ElrashedyERP-iOS-IPA
          path: ElrashedyERP-iOS.ipa
          retention-days: 30

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ElrashedyERP-Android-APK
          path: dist-android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ElrashedyERP-iOS-IPA
          path: dist-ios

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Elrashedy ERP Mobile (v1.1.0)"
          make_latest: true
          body: |
            ### 📱 التحديث الأحدث لتطبيق الرشيدي ERP (v1.1.0)
            - بناء آلي لكل من **Android (APK)** و **iOS (IPA)**.
            - نقطة بيع وكاشير متنقل وإغلاق الورديات بالرقم السري (`POS`).
            - دورة الأوامر الشاملة: صرف، استلام، إلغاء، مراجعة، تحصيل، وقفل ثنائي (`Orders`).
            - جرد المخزون، تقارير اليومية، وتسجيل الجرد الفعلي (`Stock`).
            - دليل الموردين وفواتير المشتريات والاعتماد وسجل العمليات (`Suppliers & Bills`).
            - أوامر البيع المسودة والمؤكدة واعتماد المبيعات (`Sales`).
            - خطوط التصنيع وأوامر التشغيل ومكونات الإنتاج (`Manufacturing & BOM`).
            - شؤون الموظفين، الحضور والانصراف، الإجازات، الجزاءات، ومسير الرواتب الآلي (`HR & Payroll`).
            - لوحة تحكم الإدارة، إدارة المستخدمين، واستعلامات قاعدة البيانات الآمنة (`Admin & Data Console`).
            - تقارير أداء الفروع، تحليل وتوزيع التكاليف غير المباشرة (`Reports Hub`).
            - الخزينة، الورديات المعلقة، والسلفيات المباشرة (`Safe & Treasury`).
          files: |
            dist-android/*.apk
            dist-ios/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
