name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Keystore exists
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a256e307309725c147e5ee19c5b" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Upload Build Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Failure-Logs
          path: |
            build/app/outputs/logs/
            ~/.gradle/daemon/
          retention-days: 7

      - name: Push Error Log to Debug Branch
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B debug-log
          mkdir -p ci-debug
          cp ~/.gradle/daemon/*/*.log ci-debug/ 2>/dev/null || true
          cp build/app/outputs/logs/* ci-debug/ 2>/dev/null || true
          git add ci-debug
          git commit -m "Capture CI build error logs" || true
          git push -f origin debug-log || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ElrashedyERP-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS (IPA)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ElrashedyERP-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ElrashedyERP-iOS-IPA
          path: ElrashedyERP-iOS.ipa
          retention-days: 30

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ElrashedyERP-Android-APK
          path: dist-android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ElrashedyERP-iOS-IPA
          path: dist-ios

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Elrashedy ERP Mobile (Latest Build)"
          body: |
            ### 📱 التحديث الأحدث لتطبيق الرشيدي ERP
            - تم البناء الآلي لكل من **Android** و **iOS**.
            - يتضمن نظام حضور وانصراف العمال المحسّن (10 ساعات للحاضرين).
            - الصرف والاستلام وقفل وفتح الطلبات.
            - لوحة أرقام لمسية فائقة السرعة بدون كيبورد.
          files: |
            dist-android/app-release.apk
            dist-ios/ElrashedyERP-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
